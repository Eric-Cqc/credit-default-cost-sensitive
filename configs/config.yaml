seed: 42

paths:
  raw_data: data/raw/loan.csv
  metrics: results/metrics.json
  figures: results/figures

split:
  # 80/20 development/test, then 75/25 development train/validation = 60/20/20.
  test_size: 0.20
  validation_size_within_dev: 0.25

cost_matrix:
  # Normalized illustrative business units.
  cost_fn: 5.0
  cost_fp: 1.0

threshold_grid:
  minimum: 0.01
  maximum: 0.99
  step: 0.01

models:
  logistic_regression:
    enabled: true
    C: 1.0
    solver: liblinear
    class_weight: balanced
    max_iter: 1000
    random_state: 42
  decision_tree:
    enabled: true
    criterion: gini
    max_depth: 6
    min_samples_leaf: 50
    class_weight: balanced
    random_state: 42
  random_forest:
    enabled: true
    n_estimators: 300
    max_depth: 10
    min_samples_leaf: 20
    class_weight: balanced
    n_jobs: 1
    random_state: 42
  xgboost:
    enabled: true
    n_estimators: 500
    max_depth: 4
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.8
    reg_lambda: 1.0
    n_jobs: 1
    random_state: 42
