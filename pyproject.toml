[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-default-cost-sensitive"
version = "0.1.0"
description = "A reproducible credit-default portfolio project with cost-sensitive model selection."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { file = "LICENSE" }
authors = [{ name = "Cai Qichong" }]
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<4",
  "scikit-learn>=1.4,<2",
  "matplotlib>=3.8,<4",
  "PyYAML>=6.0,<7",
  "xgboost>=2.0,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]
